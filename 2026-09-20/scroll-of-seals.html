<style>

 box-shadow:inset 0 0 0 4px rgba(0,0,0,.14),inset 0 0 0 6px rgba(255,255,255,.07),0 3px 5px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
 transition:transform .65s cubic-bezier(.2,1.5,.35,1),opacity .6s}

<script>
/* ===================== SHELL (copy to other games) ===================== */
(function theme(){const s=document.documentElement.style,t=LESSON.theme;s.setProperty('--bg',t.bg);s.setProperty('--accent',t.accent);s.setProperty('--text',t.text)})();

const Store={
  key:g=>`ss:${LESSON.id}:${g}`,
  load(g,fallback){try{const r=localStorage.getItem(this.key(g));return r?JSON.parse(r):fallback}catch(e){return fallback}},
  save(g,data){try{localStorage.setItem(this.key(g),JSON.stringify(data))}catch(e){}},
  reset(g){try{localStorage.removeItem(this.key(g))}catch(e){}}
};
const Prefs={
  get(){try{return JSON.parse(localStorage.getItem('ss:prefs'))||{sound:false}}catch(e){return{sound:false}}},
  set(p){try{localStorage.setItem('ss:prefs',JSON.stringify(p))}catch(e){}}
};

const Score={el:null,val:null,
  init(el){this.el=el},
  set(n,animate=true){if(n===this.val)return;const up=this.val!==null&&n>this.val;this.val=n;this.el.textContent=n;
    if(animate&&up){this.el.classList.remove('bump');void this.el.offsetWidth;this.el.classList.add('bump')}}
};

const Sound={ctx:null,on:false,
  tone(f,d=.14,t=0,g=.07){if(!this.on)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();const c=this.ctx,o=c.createOscillator(),a=c.createGain(),now=c.currentTime+t;
    o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(0,now);a.gain.linearRampToValueAtTime(g,now+.012);a.gain.exponentialRampToValueAtTime(.0001,now+d);
    o.connect(a).connect(c.destination);o.start(now);o.stop(now+d+.03)}catch(e){}},
  tap(tier){this.tone({common:523,uncommon:659,rare:784}[tier]||523)},
  line(){this.tone(659,.16);this.tone(988,.24,.13)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.35,i*.14,.06))}
};

const Confetti={
  run(ms=2800){const c=document.getElementById('confetti'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
    const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;c.style.opacity=1;
    const cols=[LESSON.theme.accent,LESSON.theme.text,'#b8862f','#fff7e6'],P=[];
    for(let i=0;i<170;i++)P.push({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*1.4*dpr,vy:(2+Math.random()*3)*dpr,r:Math.random()*6.28,vr:(Math.random()-.5)*.22,w:(5+Math.random()*5)*dpr,h:(8+Math.random()*8)*dpr,c:cols[i%cols.length],o:1});
    const t0=performance.now();
    const step=now=>{x.clearRect(0,0,W,H);const k=(now-t0)/ms;let alive=false;
      for(const p of P){p.x+=p.vx+Math.sin(now/320+p.r)*.5*dpr;p.y+=p.vy;p.r+=p.vr;if(k>.7)p.o=Math.max(0,1-(k-.7)/.3);if(p.y<H+20&&p.o>0)alive=true;
        x.save();x.globalAlpha=p.o;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
      if(alive&&k<1.2)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.style.opacity=0}};
    requestAnimationFrame(step)}
};

function celebrate({title,score}){
  Confetti.run();Sound.win();
  document.getElementById('certTitle').textContent=title;
  document.getElementById('certScore').textContent=score;
  document.getElementById('certDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  setTimeout(()=>document.getElementById('certOverlay').classList.add('open'),1500);
}

const Menu={
  init({onUndo,onReset,canUndo}){
    const menu=document.getElementById('menu'),btn=document.getElementById('menuBtn'),sound=document.getElementById('soundBtn'),val=document.getElementById('soundVal'),undo=document.getElementById('undoBtn'),reset=document.getElementById('resetBtn');
    const prefs=Prefs.get();Sound.on=!!prefs.sound;val.textContent=Sound.on?'On':'Off';
    const close=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');reset.textContent='Reset game';armed=false};
    let armed=false,armTimer;
    btn.addEventListener('click',e=>{e.stopPropagation();const open=!menu.classList.contains('open');if(open){undo.disabled=!canUndo();menu.classList.add('open');btn.setAttribute('aria-expanded','true')}else close()});
    document.addEventListener('click',e=>{if(!menu.contains(e.target))close()});
    sound.addEventListener('click',()=>{Sound.on=!Sound.on;Prefs.set({...Prefs.get(),sound:Sound.on});val.textContent=Sound.on?'On':'Off';if(Sound.on)Sound.tone(659,.15)});
    undo.addEventListener('click',()=>{onUndo();undo.disabled=!canUndo()});
    reset.addEventListener('click',()=>{if(!armed){armed=true;reset.textContent='Tap again to reset';clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=false;reset.textContent='Reset game'},3000);return}onReset();close()});
    return{close}
  }
};

/* ===================== SCROLL OF SEALS ===================== */
const Q=LESSON.scriptures,K=Q.length,ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'],TITLE='Keeper of the Scroll';
const scroll=document.getElementById('scroll'),rows=document.getElementById('rows'),fx=document.getElementById('fx'),certBtn=document.getElementById('certBtn'),againBtn=document.getElementById('againBtn'),overlay=document.getElementById('certOverlay'),
  scrim=document.getElementById('scrim'),card=document.getElementById('card'),ink=document.getElementById('ink'),inkRef=document.getElementById('inkRef');
let S=Store.load(GAME,null),current=-1,inkTimer=null;
if(!S||!Array.isArray(S.opened)||!Array.isArray(S.order)||S.order.length!==K||!Array.isArray(S.tries))S=fresh();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return{order:Q.map(q=>shuffle(q.choices.map((_,i)=>i))),tries:Q.map(()=>0),opened:[],won:false}}
function save(){Store.save(GAME,S)}
function pts(i){return 10+(S.tries[i]===0?5:0)}
function total(){return S.opened.reduce((a,i)=>a+pts(i),0)}
function isOpen(i){return S.opened.includes(i)}

function build(){rows.innerHTML='';
  Q.forEach((q,i)=>{const r=document.createElement('button');r.className='row';r.setAttribute('aria-label',`Seal ${i+1}, ${q.ref}`);
    r.innerHTML=`<span class="seal"><span class="half l"><span class="em">${ROMAN[i]}</span></span><span class="half r"><span class="em">${ROMAN[i]}</span></span></span><span class="lbl"><span class="ref">${q.ref}</span><span class="sub">Tap to open</span></span>`;
    r.addEventListener('click',()=>openCard(i));rows.appendChild(r)})}

function paintRow(i){const r=rows.children[i];r.classList.toggle('cracked',isOpen(i));r.querySelector('.sub').textContent=isOpen(i)?`Broken · +${pts(i)}`:'Tap to open'}

function applyState(instant){
  if(instant)scroll.classList.add('no-anim');
  Q.forEach((_,i)=>paintRow(i));
  scroll.classList.toggle('won',!!S.won);certBtn.classList.toggle('hidden',!S.won);againBtn.classList.toggle('hidden',!S.won);
  if(S.won)inscribe(true);else clearInk();
  Score.set(total(),!instant);
  if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>scroll.classList.remove('no-anim')))}

function openCard(i){current=i;const q=Q[i];
  document.getElementById('cardEyebrow').textContent=`Seal ${ROMAN[i]} · ${i+1} of ${K}`;
  document.getElementById('cardRef').textContent=q.ref;
  document.getElementById('cardLink').href=q.url;
  const qEl=document.getElementById('question'),ch=document.getElementById('choices'),note=document.getElementById('openedNote');
  ch.innerHTML='';
  if(isOpen(i)){qEl.classList.add('hidden');ch.classList.add('hidden');note.classList.remove('hidden');note.innerHTML=`Seal broken — <b>${q.choices[q.answer]}</b> was the answer.`}
  else{qEl.classList.remove('hidden');ch.classList.remove('hidden');note.classList.add('hidden');qEl.textContent=q.question;
    S.order[i].forEach(ci=>{const b=document.createElement('button');b.className='choice';b.textContent=q.choices[ci];b.addEventListener('click',()=>choose(i,ci,b));ch.appendChild(b)})}
  Sound.tone(440,.1,0,.04);scrim.classList.add('open');card.classList.add('open')}
function closeCard(){scrim.classList.remove('open');card.classList.remove('open');current=-1}

function choose(i,ci,btn){if(isOpen(i))return;
  if(ci===Q[i].answer){btn.classList.add('right');[...btn.parentNode.children].forEach(b=>{if(b!==btn)b.classList.add('wrong')});
    S.opened.push(i);const won=S.opened.length===K;if(won)S.won=true;save();
    Sound.line();setTimeout(closeCard,550);setTimeout(()=>crack(i),750);
    if(won)setTimeout(win,1900)}
  else{S.tries[i]++;save();Sound.tone(220,.18,0,.05);
    btn.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(5px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:380,easing:'ease-out'});
    btn.classList.add('wrong')}}

function crack(i){paintRow(i);const c=center(i);shards(c.x,c.y);floatText(c.x+44,c.y-10,'+'+pts(i));Score.set(total())}

function center(i){const s=rows.children[i].querySelector('.seal').getBoundingClientRect(),b=scroll.getBoundingClientRect();return{x:s.left-b.left+s.width/2,y:s.top-b.top+s.height/2}}
function floatText(x,y,txt){const e=document.createElement('span');e.className='float';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';fx.appendChild(e);
  e.animate([{transform:'translate(-50%,-50%) scale(.7)',opacity:0},{transform:'translate(-50%,-100%) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-220%) scale(1)',opacity:0}],{duration:1000,easing:'ease-out',fill:'forwards'}).onfinish=()=>e.remove()}
function shards(x,y){for(let i=0;i<12;i++){const s=document.createElement('span');s.className='shard';s.style.left=x+'px';s.style.top=y+'px';fx.appendChild(s);
  const a=-Math.PI/2+(Math.random()-.5)*2.6,d=30+Math.random()*40,dx=Math.cos(a)*d,dy=Math.sin(a)*d,rot=(Math.random()-.5)*540;
  s.animate([{transform:'translate(-50%,-50%) rotate(0) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${rot/2}deg) scale(1)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx*1.2}px),calc(-50% + ${dy+70}px)) rotate(${rot}deg) scale(.6)`,opacity:0}],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.6,.4,1)',fill:'forwards'}).onfinish=()=>s.remove()}}

function clearInk(){clearTimeout(inkTimer);ink.innerHTML='';inkRef.style.opacity=0}
function inscribe(instant){clearInk();const text=LESSON.keyVerse.text;inkRef.textContent=LESSON.keyVerse.ref;
  let i=0;text.split(' ').forEach((word,wi,arr)=>{const w=document.createElement('span');w.className='w';ink.appendChild(w);
    const chars=[...word];if(wi<arr.length-1)chars.push(' ');
    chars.forEach(ch=>{const s=document.createElement('span');s.className='c';s.textContent=ch;(ch===' '?ink:w).appendChild(s);
      if(instant)s.style.opacity=1;
      else s.animate([{opacity:0,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,delay:i*55,easing:'ease-out',fill:'forwards'});i++})});
  if(instant)inkRef.style.opacity=1;
  else inkTimer=setTimeout(()=>{inkRef.style.opacity=1},text.length*55+300);
  return text.length*55+300}

function win(){scroll.classList.add('won');certBtn.classList.remove('hidden');againBtn.classList.remove('hidden');
  setTimeout(()=>{const d=inscribe(false);setTimeout(()=>celebrate({title:TITLE,score:total()}),d+900)},1500)}

function undo(){if(!S.opened.length)return;const i=S.opened.pop();S.won=false;overlay.classList.remove('open');closeCard();
  scroll.classList.remove('won');certBtn.classList.add('hidden');againBtn.classList.add('hidden');clearInk();paintRow(i);Score.set(total());save()}
function reset(){Store.reset(GAME);S=fresh();overlay.classList.remove('open');closeCard();build();applyState(true);save()}

// init
document.getElementById('title').textContent=LESSON.title;
document.title=`Scroll of Seals · ${LESSON.title}`;
document.getElementById('certLesson').innerHTML=`${LESSON.title}<span>${LESSON.reference}</span>`;
Score.init(document.getElementById('score'));
Menu.init({onUndo:undo,onReset:reset,canUndo:()=>S.opened.length>0});
build();applyState(true);
scrim.addEventListener('click',closeCard);
document.getElementById('cardClose').addEventListener('click',closeCard);
certBtn.addEventListener('click',()=>celebrate({title:TITLE,score:total()}));
againBtn.addEventListener('click',reset);
document.getElementById('certClose').addEventListener('click',()=>overlay.classList.remove('open'));
</script>
</body>
