<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>Light the Lamps · The Redeemer Shall Come to Zion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<script>
// ===================== LESSON PACK — edit weekly =====================
const LESSON = {
  id: "2026-10-18-isaiah-58-66",
  title: "The Redeemer Shall Come to Zion",
  reference: "Isaiah 58–66",
  theme: { bg: "#0d1b2a", accent: "#d4a24c", text: "#f4ecd8" },
  words: [
    { word: "LIGHT", clue: "“Arise, shine; for thy _____ is come.”",         ref: "Isaiah 60:1" },
    { word: "ASHES", clue: "“To give unto them beauty for _____.”",          ref: "Isaiah 61:3" },
    { word: "BREAD", clue: "“Is it not to deal thy _____ to the hungry?”",   ref: "Isaiah 58:7" }
  ],
  revealVerse: { ref: "Isaiah 62:1", text: "…until the righteousness thereof go forth as brightness, and the salvation thereof as a lamp that burneth." }
};
const GAME = "light-the-lamps";
// =====================================================================
</script>
<style>
/* ===================== SHELL STYLES (copy to other games) ===================== */
:root{--bg:#0d1b2a;--accent:#d4a24c;--text:#f4ecd8;--panel:#15283c;--panel-2:#1b3249;--muted:rgba(244,236,216,.62);--line:rgba(212,162,76,.22);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%}
body{padding:max(10px,env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:100%;max-width:480px}
.top{display:flex;align-items:center;justify-content:space-between;height:48px}
.back{display:flex;align-items:center;gap:4px;height:48px;padding:0 4px;font-size:15px;color:var(--muted)}
.back:hover{color:var(--accent)}
.score-wrap{display:flex;align-items:baseline;gap:8px}
.score-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--accent);line-height:1;display:inline-block;min-width:1.2em;text-align:center;transform-origin:center}
.score.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
.menu-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
.menu-btn:hover{color:var(--accent)}
.menu-btn svg{width:22px;height:22px}
.menu{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 52px);right:16px;z-index:20;min-width:210px;padding:6px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);
opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s}
.menu.open{opacity:1;transform:none;visibility:visible}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 14px;border-radius:9px;font-size:15px;text-align:left}
.menu button:hover{background:rgba(212,162,76,.1)}
.menu button[disabled]{opacity:.4;cursor:default}
.menu .val{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.menu .danger{color:#e8b4a0}
.eyebrow{margin:14px 0 4px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);text-align:center}
.title{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(28px,8vw,36px);line-height:1.05;text-align:center;text-wrap:balance}
.hint{margin:8px 0 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:600;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;opacity:0}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,12,20,.82);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.overlay.open{opacity:1;visibility:visible}
.cert{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(20px) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.overlay.open .cert{transform:none}
.cert-card{width:100%;aspect-ratio:4/5;padding:28px 22px;border-radius:6px;background:linear-gradient(160deg,#16293e,#0d1b2a);border:1px solid var(--accent);box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px var(--accent),0 20px 60px rgba(0,0,0,.6);
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.cert-eyebrow{margin:0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert-title{margin:6px 0 0;font-family:var(--serif);font-weight:600;font-style:italic;font-size:34px;line-height:1.05;color:var(--accent);text-wrap:balance}
.cert-rule{width:56px;height:1px;background:var(--accent);margin:14px 0;opacity:.7}
.cert-score{margin:0;font-family:var(--serif);font-size:56px;font-weight:700;line-height:1}
.cert-score small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.cert-lesson{margin:18px 0 0;font-family:var(--serif);font-size:20px;line-height:1.2}
.cert-lesson span{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
.cert-date{margin:10px 0 0;font-size:12px;color:var(--muted)}
.cert-hint{margin:0;font-size:12px;color:var(--muted)}
.after{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
.hidden{display:none!important}
/* calmer motion for people who ask their phone for it */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
/* ===================== GAME STYLES ===================== */
.lamps{display:flex;justify-content:center;gap:22px;margin:4px 0 10px}
.lamp{width:74px;position:relative}
.lamp svg{display:block;width:100%;overflow:visible}
.lamp .flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.3);transition:opacity .6s,transform .8s cubic-bezier(.2,1.5,.4,1)}
.lamp.lit .flame{opacity:1;transform:scale(1);animation:flicker 2.2s ease-in-out infinite .8s}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
.lamp .glow{opacity:0;transition:opacity .9s}
.lamp.lit .glow{opacity:1}
.lamp.cur::after{content:"";position:absolute;left:50%;bottom:-8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.clue-row{text-align:center;min-height:44px;margin-bottom:8px}
.clue-btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.clue{margin:0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.25;text-wrap:balance}
.clue small{display:block;margin-top:2px;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.tiles{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(100%,290px);margin:0 auto}
.trow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tl{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid rgba(212,162,76,.18);background:rgba(21,40,60,.5);
 font-family:var(--serif);font-weight:700;font-size:clamp(22px,6.6vw,28px);text-transform:uppercase;transition:background .3s,border-color .3s,color .3s}
.tl.typed{border-color:rgba(244,236,216,.45)}
.tl.hit{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tl.near{background:rgba(212,162,76,.12);border:2.5px dashed #e3c27f;color:#f1d79c}
.tl.miss{background:#0a1522;border-color:#0a1522;color:rgba(244,236,216,.4)}
.trow.shake{animation:shake .38s ease-out}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.msg{min-height:22px;margin:10px 0 6px;text-align:center;font-size:14px;color:var(--muted)}
.msg b{color:var(--accent)}
.kb{display:grid;gap:6px;user-select:none;-webkit-user-select:none}
.krow{display:flex;gap:4px;justify-content:center}
.key{flex:1 1 0;max-width:38px;height:48px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0}
.key.wide{flex:1.6 1 0;max-width:62px;font-size:12px;letter-spacing:.04em}
.key.hit{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.key.near{border:2px dashed #e3c27f;color:#f1d79c}
.key.miss{opacity:.32}
.key:active{transform:scale(.94)}
.next{display:flex;justify-content:center;margin:10px 0 0}
.verse-card{margin:12px 0 0;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center}
.verse-card p{margin:0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.28;text-wrap:pretty}
.verse-card .r{margin:8px 0 0;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.legend{margin:14px 0 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}
.legend b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html" aria-label="Back to games"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>Games</a>
    <div class="score-wrap"><span class="score-label">Score</span><span class="score" id="score">0</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>

  <p class="eyebrow">Light the Lamps</p>
  <h1 class="title" id="title"></h1>
  <p class="hint">Guess the five-letter word from this week's reading. Each word you find lights a lamp.</p>

  <div class="lamps" id="lamps"></div>
  <div class="clue-row"><button class="clue-btn" id="clueBtn">Show the verse clue</button><p class="clue hidden" id="clue"></p></div>
  <div class="tiles" id="tiles"></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="next hidden" id="nextWrap"><button class="btn" id="nextBtn">Next lamp</button></div>
  <div class="kb" id="kb"></div>
  <div class="verse-card hidden" id="verseCard"><p id="verseText"></p><p class="r" id="verseRef"></p></div>

  <p class="legend"><b>Gold</b> = right letter, right spot · <b>outlined</b> = in the word, wrong spot</p>
  <div class="after"><button class="btn ghost hidden" id="certBtn">View certificate</button><button class="btn ghost hidden" id="againBtn">Play again</button></div>
</div>



<div class="menu" id="menu" role="menu">
  <button id="soundBtn" role="menuitem">Sound <span class="val" id="soundVal">Off</span></button>
  <button id="undoBtn" role="menuitem">Undo</button>
  <button id="resetBtn" class="danger" role="menuitem">Reset game</button>
</div>

<canvas id="confetti"></canvas>

<div class="overlay" id="certOverlay">
  <div class="cert">
    <div class="cert-card">
      <p class="cert-eyebrow">Light the Lamps · Completed</p>
      <h2 class="cert-title" id="certTitle">A Lamp That Burneth</h2>
      <div class="cert-rule"></div>
      <p class="cert-score"><span id="certScore">0</span><small>points</small></p>
      <p class="cert-lesson" id="certLesson"></p>
      <p class="cert-date" id="certDate"></p>
    </div>
    <button class="btn" id="certClose">Back to the lamps</button>
    <p class="cert-hint">Take a screenshot to keep it.</p>
  </div>
</div>

<script>
/* ===================== SHELL (copy to other games) ===================== */
(function theme(){const s=document.documentElement.style,t=LESSON.theme;s.setProperty('--bg',t.bg);s.setProperty('--accent',t.accent);s.setProperty('--text',t.text)})();

const Store={
  key:g=>`ss:${LESSON.id}:${g}`,
  load(g,fallback){try{const r=localStorage.getItem(this.key(g));return r?JSON.parse(r):fallback}catch(e){return fallback}},
  save(g,data){try{localStorage.setItem(this.key(g),JSON.stringify(data))}catch(e){}},
  reset(g){try{localStorage.removeItem(this.key(g))}catch(e){}}
};
const Prefs={
  get(){try{return JSON.parse(localStorage.getItem('ss:prefs'))||{sound:false}}catch(e){return{sound:false}}},
  set(p){try{localStorage.setItem('ss:prefs',JSON.stringify(p))}catch(e){}}
};

const Score={el:null,val:null,
  init(el){this.el=el},
  set(n,animate=true){if(n===this.val)return;const up=this.val!==null&&n>this.val;this.val=n;this.el.textContent=n;
    if(animate&&up){this.el.classList.remove('bump');void this.el.offsetWidth;this.el.classList.add('bump')}}
};

const Sound={ctx:null,on:false,
  tone(f,d=.14,t=0,g=.07){if(!this.on)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();const c=this.ctx,o=c.createOscillator(),a=c.createGain(),now=c.currentTime+t;
    o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(0,now);a.gain.linearRampToValueAtTime(g,now+.012);a.gain.exponentialRampToValueAtTime(.0001,now+d);
    o.connect(a).connect(c.destination);o.start(now);o.stop(now+d+.03)}catch(e){}},
  tap(tier){this.tone({common:523,uncommon:659,rare:784}[tier]||523)},
  line(){this.tone(659,.16);this.tone(988,.24,.13)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.35,i*.14,.06))}
};

const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const Confetti={
  run(ms=2800){if(RM)return;const c=document.getElementById('confetti'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
    const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;c.style.opacity=1;
    const cols=[LESSON.theme.accent,LESSON.theme.text,'#b8862f','#fff7e6'],P=[];
    for(let i=0;i<170;i++)P.push({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*1.4*dpr,vy:(2+Math.random()*3)*dpr,r:Math.random()*6.28,vr:(Math.random()-.5)*.22,w:(5+Math.random()*5)*dpr,h:(8+Math.random()*8)*dpr,c:cols[i%cols.length],o:1});
    const t0=performance.now();
    const step=now=>{x.clearRect(0,0,W,H);const k=(now-t0)/ms;let alive=false;
      for(const p of P){p.x+=p.vx+Math.sin(now/320+p.r)*.5*dpr;p.y+=p.vy;p.r+=p.vr;if(k>.7)p.o=Math.max(0,1-(k-.7)/.3);if(p.y<H+20&&p.o>0)alive=true;
        x.save();x.globalAlpha=p.o;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
      if(alive&&k<1.2)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.style.opacity=0}};
    requestAnimationFrame(step)}
};

function celebrate({title,score}){
  Confetti.run();Sound.win();
  document.getElementById('certTitle').textContent=title;
  document.getElementById('certScore').textContent=score;
  document.getElementById('certDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  setTimeout(()=>document.getElementById('certOverlay').classList.add('open'),1500);
}

const Menu={
  init({onUndo,onReset,canUndo}){
    const menu=document.getElementById('menu'),btn=document.getElementById('menuBtn'),sound=document.getElementById('soundBtn'),val=document.getElementById('soundVal'),undo=document.getElementById('undoBtn'),reset=document.getElementById('resetBtn');
    const prefs=Prefs.get();Sound.on=!!prefs.sound;val.textContent=Sound.on?'On':'Off';
    const close=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');reset.textContent='Reset game';armed=false};
    let armed=false,armTimer;
    btn.addEventListener('click',e=>{e.stopPropagation();const open=!menu.classList.contains('open');if(open){undo.disabled=!canUndo();menu.classList.add('open');btn.setAttribute('aria-expanded','true')}else close()});
    document.addEventListener('click',e=>{if(!menu.contains(e.target))close()});
    sound.addEventListener('click',()=>{Sound.on=!Sound.on;Prefs.set({...Prefs.get(),sound:Sound.on});val.textContent=Sound.on?'On':'Off';if(Sound.on)Sound.tone(659,.15)});
    undo.addEventListener('click',()=>{onUndo();undo.disabled=!canUndo()});
    reset.addEventListener('click',()=>{if(!armed){armed=true;reset.textContent='Tap again to reset';clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=false;reset.textContent='Reset game'},3000);return}onReset();close()});
    return{close}
  }
};

// shared init
document.getElementById('title').textContent=LESSON.title;
document.getElementById('certLesson').innerHTML=`${LESSON.title}<span>${LESSON.reference}</span>`;
Score.init(document.getElementById('score'));
document.getElementById('certClose').addEventListener('click',()=>document.getElementById('certOverlay').classList.remove('open'));
document.title=`Light the Lamps · ${LESSON.title}`;

/* ===================== LIGHT THE LAMPS ===================== */
const WORDS=LESSON.words.map(w=>({...w,word:w.word.toUpperCase()})),K=WORDS.length,ROWS=6,LEN=5,TITLE='A Lamp That Burneth';
const lampsEl=document.getElementById('lamps'),tilesEl=document.getElementById('tiles'),kbEl=document.getElementById('kb'),msg=document.getElementById('msg'),clueBtn=document.getElementById('clueBtn'),clue=document.getElementById('clue'),
  nextWrap=document.getElementById('nextWrap'),nextBtn=document.getElementById('nextBtn'),verseCard=document.getElementById('verseCard'),certBtn=document.getElementById('certBtn'),againBtn=document.getElementById('againBtn'),overlay=document.getElementById('certOverlay');
const LAMP=`<svg viewBox="0 0 80 60" aria-hidden="true"><defs><radialGradient id="g{i}" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".85"/><stop offset="1" stop-color="#ffcc66" stop-opacity="0"/></radialGradient></defs>
<ellipse class="glow" cx="58" cy="16" rx="24" ry="20" fill="url(#g{i})"/>
<g class="flame"><path d="M60 28 C51 20 53 10 61 0 C69 10 71 20 62 28 Z" fill="#ffb43c"/><path d="M60.5 27 C56 21 57 15 61 8 C65 15 66 21 61.5 27 Z" fill="#fff1c2"/></g>
<path d="M8 40 C8 30 22 26 40 26 C54 26 62 28 66 30 L60 34 C64 36 66 40 62 44 C52 52 20 52 12 46 Z" fill="#b8862f"/>
<path d="M8 40 C8 30 22 26 40 26 C54 26 62 28 66 30 L60 34 C50 32 30 32 14 38 Z" fill="#d4a24c"/>
<ellipse cx="36" cy="30" rx="7" ry="2" fill="#5a3b12"/><path d="M8 40 C2 38 2 30 10 32" fill="none" stroke="#b8862f" stroke-width="3" stroke-linecap="round"/></svg>`;
const KEYS=['QWERTYUIOP','ASDFGHJKL','>ZXCVBNM<'];
let S=Store.load(GAME,null),cur='',busy=false;
if(!S||!Array.isArray(S.guesses)||S.guesses.length!==K||!Array.isArray(S.lit))S=fresh();

function fresh(){return{w:0,guesses:WORDS.map(()=>[]),result:WORDS.map(()=>null),clue:WORDS.map(()=>false),lit:[],won:false}}
function save(){Store.save(GAME,S)}
function pts(i){const r=S.result[i];if(!r)return 0;return r==='solved'?10+(ROWS-S.guesses[i].length)*2:5}
function total(){return WORDS.reduce((a,_,i)=>a+pts(i),0)}
function score(g,ans){const res=Array(LEN).fill('miss'),left={};
  for(let i=0;i<LEN;i++){if(g[i]===ans[i])res[i]='hit';else left[ans[i]]=(left[ans[i]]||0)+1}
  for(let i=0;i<LEN;i++){if(res[i]!=='hit'&&left[g[i]]){res[i]='near';left[g[i]]--}}return res}

function buildLamps(){lampsEl.innerHTML='';WORDS.forEach((_,i)=>{const d=document.createElement('div');d.className='lamp';d.innerHTML=LAMP.replaceAll('{i}',i);d.setAttribute('aria-label',`Lamp ${i+1}`);lampsEl.appendChild(d)})}
function paintLamps(){[...lampsEl.children].forEach((d,i)=>{d.classList.toggle('lit',S.lit.includes(i));d.classList.toggle('cur',!S.won&&i===S.w&&!S.lit.includes(i))})}
function buildKb(){kbEl.innerHTML='';KEYS.forEach(row=>{const r=document.createElement('div');r.className='krow';
  [...row].forEach(ch=>{const b=document.createElement('button');b.className='key'+(ch==='>'||ch==='<'?' wide':'');
    b.textContent=ch==='>'?'ENTER':ch==='<'?'⌫':ch;b.dataset.k=ch==='>'?'Enter':ch==='<'?'Backspace':ch;b.setAttribute('aria-label',ch==='<'?'Delete letter':ch==='>'?'Enter guess':ch);
    b.addEventListener('click',()=>press(b.dataset.k));r.appendChild(b)});kbEl.appendChild(r)})}

function paint(){const i=Math.min(S.w,K-1),word=WORDS[i],G=S.guesses[i];tilesEl.innerHTML='';
  for(let r=0;r<ROWS;r++){const row=document.createElement('div');row.className='trow';const g=G[r],res=g?score(g,word.word):null;
    for(let c=0;c<LEN;c++){const t=document.createElement('div');t.className='tl';
      if(g){t.textContent=g[c];t.classList.add(res[c])}
      else if(r===G.length&&!S.result[i]&&cur[c]){t.textContent=cur[c];t.classList.add('typed')}
      row.appendChild(t)}tilesEl.appendChild(row)}
  const best={};G.forEach(g=>score(g,word.word).forEach((s,c)=>{const ch=g[c],rank={hit:3,near:2,miss:1};if((rank[s]||0)>(rank[best[ch]]||0))best[ch]=s}));
  kbEl.querySelectorAll('.key').forEach(k=>{k.classList.remove('hit','near','miss');if(best[k.dataset.k])k.classList.add(best[k.dataset.k])});
  const showClue=S.clue[i]||!!S.result[i];clue.classList.toggle('hidden',!showClue);clueBtn.classList.toggle('hidden',showClue);
  clue.innerHTML='';clue.appendChild(document.createTextNode(S.result[i]?word.clue.replace('_____',word.word.toLowerCase()):word.clue));const sm=document.createElement('small');sm.textContent=word.ref;clue.appendChild(sm);
  const done=!!S.result[i];kbEl.classList.toggle('hidden',done||S.won);nextWrap.classList.toggle('hidden',!done||S.won||S.w>=K-1);
  verseCard.classList.toggle('hidden',!S.won);certBtn.classList.toggle('hidden',!S.won);againBtn.classList.toggle('hidden',!S.won);
  if(!done)msg.innerHTML=G.length?`Guess ${G.length+1} of ${ROWS}`:`Lamp ${i+1} of ${K} · type any five letters`;
  paintLamps()}

function press(k){if(busy||S.won)return;const i=S.w;if(S.result[i])return;
  if(k==='Backspace'){cur=cur.slice(0,-1);paint();return}
  if(k==='Enter'){submit();return}
  if(/^[A-Z]$/.test(k)&&cur.length<LEN){cur+=k;Sound.tone(587,.05,0,.025);paint()}}
function submit(){const i=S.w,word=WORDS[i];
  if(cur.length<LEN){msg.textContent='Five letters, please.';const row=tilesEl.children[S.guesses[i].length];if(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake')}return}
  S.guesses[i].push(cur);const g=cur;cur='';
  if(g===word.word){S.result[i]='solved';S.lit.push(i)}
  else if(S.guesses[i].length>=ROWS){S.result[i]='revealed';S.lit.push(i)}
  if(S.lit.length===K)S.won=true;save();paint();
  const row=tilesEl.children[S.guesses[i].length-1];[...row.children].forEach((t,c)=>t.animate([{transform:'rotateX(90deg)'},{transform:'rotateX(0)'}],{duration:260,delay:c*90,easing:'ease-out',fill:'backwards'}));
  if(S.result[i]){busy=true;setTimeout(()=>{busy=false;finishWord(i)},LEN*90+300)}else Sound.tone(440,.08,0,.03)}
function finishWord(i){const r=S.result[i];Score.set(total());Sound.line();
  msg.innerHTML=r==='solved'?`<b>${WORDS[i].word}</b> · the lamp is lit (+${pts(i)})`:`The word was <b>${WORDS[i].word}</b>. The lamp is lit anyway (+${pts(i)}).`;
  if(S.won){verseCard.classList.remove('hidden');verseCard.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:600,easing:'ease-out'});setTimeout(()=>celebrate({title:TITLE,score:total()}),2000)}}

nextBtn.addEventListener('click',()=>{if(S.w<K-1){S.w++;cur='';save();paint()}});
clueBtn.addEventListener('click',()=>{S.clue[S.w]=true;save();paint()});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.length===1?e.key.toUpperCase():e.key;if(k==='Enter'||k==='Backspace'||/^[A-Z]$/.test(k)){e.preventDefault();press(k)}});

function reset(){Store.reset(GAME);S=fresh();cur='';overlay.classList.remove('open');paint();Score.set(total(),false);save()}
document.getElementById('verseText').textContent=LESSON.revealVerse.text;
document.getElementById('verseRef').textContent=LESSON.revealVerse.ref;
Menu.init({onUndo:()=>{},onReset:reset,canUndo:()=>false});
buildLamps();buildKb();
if(S.result[S.w]&&S.w<K-1&&!S.won){/* finished word, waiting on Next */}
paint();Score.set(total(),false);
if(S.result[S.w])msg.innerHTML=S.result[S.w]==='solved'?`<b>${WORDS[S.w].word}</b> · the lamp is lit`:`The word was <b>${WORDS[S.w].word}</b>.`;
certBtn.addEventListener('click',()=>celebrate({title:TITLE,score:total()}));
againBtn.addEventListener('click',reset);
</script>
</body>
</html>
