<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>Names of the Redeemer · The Redeemer Shall Come to Zion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<script>
// ===================== LESSON PACK — edit weekly =====================
const LESSON = {
  id: "2026-10-18-isaiah-58-66",
  title: "The Redeemer Shall Come to Zion",
  reference: "Isaiah 58–66",
  theme: { bg: "#0d1b2a", accent: "#d4a24c", text: "#f4ecd8" },
  pairs: [
    { name: "Redeemer",            verse: "“The ___ shall come to Zion”",                ref: "Isaiah 59:20" },
    { name: "Intercessor",         verse: "“He wondered that there was no ___”",         ref: "Isaiah 59:16" },
    { name: "Everlasting Light",   verse: "“The Lord shall be unto thee an ___”",        ref: "Isaiah 60:19" },
    { name: "Mighty One of Jacob", verse: "“Thy Redeemer, the ___”",                     ref: "Isaiah 60:16" },
    { name: "Saviour",             verse: "“So he was their ___”",                       ref: "Isaiah 63:8" },
    { name: "Potter",              verse: "“We are the clay, and thou our ___”",         ref: "Isaiah 64:8" }
  ],
  revealVerse: { ref: "Isaiah 59:20", text: "And the Redeemer shall come to Zion." }
};
const GAME = "names-of-the-redeemer";
// =====================================================================
</script>
<style>
/* ===================== SHELL STYLES (copy to other games) ===================== */
:root{--bg:#0d1b2a;--accent:#d4a24c;--text:#f4ecd8;--panel:#15283c;--panel-2:#1b3249;--muted:rgba(244,236,216,.62);--line:rgba(212,162,76,.22);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%}
body{padding:max(10px,env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:100%;max-width:480px}
.top{display:flex;align-items:center;justify-content:space-between;height:48px}
.back{display:flex;align-items:center;gap:4px;height:48px;padding:0 4px;font-size:15px;color:var(--muted)}
.back:hover{color:var(--accent)}
.score-wrap{display:flex;align-items:baseline;gap:8px}
.score-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--accent);line-height:1;display:inline-block;min-width:1.2em;text-align:center;transform-origin:center}
.score.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
.menu-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
.menu-btn:hover{color:var(--accent)}
.menu-btn svg{width:22px;height:22px}
.menu{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 52px);right:16px;z-index:20;min-width:210px;padding:6px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);
opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s}
.menu.open{opacity:1;transform:none;visibility:visible}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 14px;border-radius:9px;font-size:15px;text-align:left}
.menu button:hover{background:rgba(212,162,76,.1)}
.menu button[disabled]{opacity:.4;cursor:default}
.menu .val{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.menu .danger{color:#e8b4a0}
.eyebrow{margin:14px 0 4px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);text-align:center}
.title{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(28px,8vw,36px);line-height:1.05;text-align:center;text-wrap:balance}
.hint{margin:8px 0 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:600;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;opacity:0}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,12,20,.82);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.overlay.open{opacity:1;visibility:visible}
.cert{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(20px) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.overlay.open .cert{transform:none}
.cert-card{width:100%;aspect-ratio:4/5;padding:28px 22px;border-radius:6px;background:linear-gradient(160deg,#16293e,#0d1b2a);border:1px solid var(--accent);box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px var(--accent),0 20px 60px rgba(0,0,0,.6);
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.cert-eyebrow{margin:0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert-title{margin:6px 0 0;font-family:var(--serif);font-weight:600;font-style:italic;font-size:34px;line-height:1.05;color:var(--accent);text-wrap:balance}
.cert-rule{width:56px;height:1px;background:var(--accent);margin:14px 0;opacity:.7}
.cert-score{margin:0;font-family:var(--serif);font-size:56px;font-weight:700;line-height:1}
.cert-score small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.cert-lesson{margin:18px 0 0;font-family:var(--serif);font-size:20px;line-height:1.2}
.cert-lesson span{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
.cert-date{margin:10px 0 0;font-size:12px;color:var(--muted)}
.cert-hint{margin:0;font-size:12px;color:var(--muted)}
.after{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
.hidden{display:none!important}
/* calmer motion for people who ask their phone for it */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
/* ===================== GAME STYLES ===================== */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;aspect-ratio:4/5;perspective:800px;padding:0;border-radius:12px}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.up .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;overflow:hidden}
.bk{background:radial-gradient(circle at 50% 38%,#1f3a57,#13263a 72%);border:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.bk svg{width:46%;opacity:.85}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,#f4ecd8,#e6d6b4);color:#2c2112;border:1px solid #c9ad7c;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.front .nm{font-family:var(--serif);font-weight:700;font-size:clamp(18px,5.4vw,23px);line-height:1.05;text-wrap:balance}
.front .vs{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(14px,4vw,17px);line-height:1.15;text-wrap:balance}
.front .rf{margin-top:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7a5a24}
.front .tag{position:absolute;top:6px;left:0;right:0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8a6a30}
.card.matched .front{background:linear-gradient(160deg,#f6dfa0,#e2bd69);border-color:#b8862f;box-shadow:0 0 0 2px rgba(212,162,76,.55),0 4px 16px rgba(212,162,76,.35)}
.card.matched .inner{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.07)}100%{transform:rotateY(180deg) scale(1)}}
.grid.no-anim .inner{transition:none!important;animation:none!important}
.wrap-fx{position:relative}
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.float{position:absolute;font-family:var(--serif);font-weight:700;font-size:26px;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.6);will-change:transform,opacity;z-index:5}
.found{margin:12px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.found b{color:var(--accent)}
.verse-card{margin:14px 0 0;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center}
.verse-card p{margin:0;font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.25}
.verse-card .r{margin:8px 0 0;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.legend{margin:14px 0 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}
.legend b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html" aria-label="Back to games"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>Games</a>
    <div class="score-wrap"><span class="score-label">Score</span><span class="score" id="score">0</span></div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>

  <p class="eyebrow">Names of the Redeemer</p>
  <h1 class="title" id="title"></h1>
  <p class="hint">Flip two cards at a time. Match each name of Christ to the verse it comes from.</p>

  <div class="wrap-fx">
    <div class="grid" id="grid"></div>
    <div class="fx" id="fx"></div>
  </div>
  <p class="found" id="found"></p>
  <div class="verse-card hidden" id="verseCard"><p id="verseText"></p><p class="r" id="verseRef"></p></div>

  <p class="legend"><b>+10</b> for each match · misses cost nothing</p>
  <div class="after"><button class="btn ghost hidden" id="certBtn">View certificate</button><button class="btn ghost hidden" id="againBtn">Play again</button></div>
</div>



<div class="menu" id="menu" role="menu">
  <button id="soundBtn" role="menuitem">Sound <span class="val" id="soundVal">Off</span></button>
  <button id="undoBtn" role="menuitem">Undo</button>
  <button id="resetBtn" class="danger" role="menuitem">Reset game</button>
</div>

<canvas id="confetti"></canvas>

<div class="overlay" id="certOverlay">
  <div class="cert">
    <div class="cert-card">
      <p class="cert-eyebrow">Names of the Redeemer · Completed</p>
      <h2 class="cert-title" id="certTitle">Witness of His Names</h2>
      <div class="cert-rule"></div>
      <p class="cert-score"><span id="certScore">0</span><small>points</small></p>
      <p class="cert-lesson" id="certLesson"></p>
      <p class="cert-date" id="certDate"></p>
    </div>
    <button class="btn" id="certClose">Back to the cards</button>
    <p class="cert-hint">Take a screenshot to keep it.</p>
  </div>
</div>

<script>
/* ===================== SHELL (copy to other games) ===================== */
(function theme(){const s=document.documentElement.style,t=LESSON.theme;s.setProperty('--bg',t.bg);s.setProperty('--accent',t.accent);s.setProperty('--text',t.text)})();

const Store={
  key:g=>`ss:${LESSON.id}:${g}`,
  load(g,fallback){try{const r=localStorage.getItem(this.key(g));return r?JSON.parse(r):fallback}catch(e){return fallback}},
  save(g,data){try{localStorage.setItem(this.key(g),JSON.stringify(data))}catch(e){}},
  reset(g){try{localStorage.removeItem(this.key(g))}catch(e){}}
};
const Prefs={
  get(){try{return JSON.parse(localStorage.getItem('ss:prefs'))||{sound:false}}catch(e){return{sound:false}}},
  set(p){try{localStorage.setItem('ss:prefs',JSON.stringify(p))}catch(e){}}
};

const Score={el:null,val:null,
  init(el){this.el=el},
  set(n,animate=true){if(n===this.val)return;const up=this.val!==null&&n>this.val;this.val=n;this.el.textContent=n;
    if(animate&&up){this.el.classList.remove('bump');void this.el.offsetWidth;this.el.classList.add('bump')}}
};

const Sound={ctx:null,on:false,
  tone(f,d=.14,t=0,g=.07){if(!this.on)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();const c=this.ctx,o=c.createOscillator(),a=c.createGain(),now=c.currentTime+t;
    o.type='sine';o.frequency.value=f;a.gain.setValueAtTime(0,now);a.gain.linearRampToValueAtTime(g,now+.012);a.gain.exponentialRampToValueAtTime(.0001,now+d);
    o.connect(a).connect(c.destination);o.start(now);o.stop(now+d+.03)}catch(e){}},
  tap(tier){this.tone({common:523,uncommon:659,rare:784}[tier]||523)},
  line(){this.tone(659,.16);this.tone(988,.24,.13)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.35,i*.14,.06))}
};

const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const Confetti={
  run(ms=2800){if(RM)return;const c=document.getElementById('confetti'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
    const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;c.style.opacity=1;
    const cols=[LESSON.theme.accent,LESSON.theme.text,'#b8862f','#fff7e6'],P=[];
    for(let i=0;i<170;i++)P.push({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*1.4*dpr,vy:(2+Math.random()*3)*dpr,r:Math.random()*6.28,vr:(Math.random()-.5)*.22,w:(5+Math.random()*5)*dpr,h:(8+Math.random()*8)*dpr,c:cols[i%cols.length],o:1});
    const t0=performance.now();
    const step=now=>{x.clearRect(0,0,W,H);const k=(now-t0)/ms;let alive=false;
      for(const p of P){p.x+=p.vx+Math.sin(now/320+p.r)*.5*dpr;p.y+=p.vy;p.r+=p.vr;if(k>.7)p.o=Math.max(0,1-(k-.7)/.3);if(p.y<H+20&&p.o>0)alive=true;
        x.save();x.globalAlpha=p.o;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
      if(alive&&k<1.2)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.style.opacity=0}};
    requestAnimationFrame(step)}
};

function celebrate({title,score}){
  Confetti.run();Sound.win();
  document.getElementById('certTitle').textContent=title;
  document.getElementById('certScore').textContent=score;
  document.getElementById('certDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  setTimeout(()=>document.getElementById('certOverlay').classList.add('open'),1500);
}

const Menu={
  init({onUndo,onReset,canUndo}){
    const menu=document.getElementById('menu'),btn=document.getElementById('menuBtn'),sound=document.getElementById('soundBtn'),val=document.getElementById('soundVal'),undo=document.getElementById('undoBtn'),reset=document.getElementById('resetBtn');
    const prefs=Prefs.get();Sound.on=!!prefs.sound;val.textContent=Sound.on?'On':'Off';
    const close=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');reset.textContent='Reset game';armed=false};
    let armed=false,armTimer;
    btn.addEventListener('click',e=>{e.stopPropagation();const open=!menu.classList.contains('open');if(open){undo.disabled=!canUndo();menu.classList.add('open');btn.setAttribute('aria-expanded','true')}else close()});
    document.addEventListener('click',e=>{if(!menu.contains(e.target))close()});
    sound.addEventListener('click',()=>{Sound.on=!Sound.on;Prefs.set({...Prefs.get(),sound:Sound.on});val.textContent=Sound.on?'On':'Off';if(Sound.on)Sound.tone(659,.15)});
    undo.addEventListener('click',()=>{onUndo();undo.disabled=!canUndo()});
    reset.addEventListener('click',()=>{if(!armed){armed=true;reset.textContent='Tap again to reset';clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=false;reset.textContent='Reset game'},3000);return}onReset();close()});
    return{close}
  }
};

// shared init
document.getElementById('title').textContent=LESSON.title;
document.getElementById('certLesson').innerHTML=`${LESSON.title}<span>${LESSON.reference}</span>`;
Score.init(document.getElementById('score'));
document.getElementById('certClose').addEventListener('click',()=>document.getElementById('certOverlay').classList.remove('open'));
document.title=`Names of the Redeemer · ${LESSON.title}`;

/* ===================== NAMES OF THE REDEEMER ===================== */
const P=LESSON.pairs,NP=P.length,TITLE='Witness of His Names';
const grid=document.getElementById('grid'),fx=document.getElementById('fx'),foundEl=document.getElementById('found'),verseCard=document.getElementById('verseCard'),
  certBtn=document.getElementById('certBtn'),againBtn=document.getElementById('againBtn'),overlay=document.getElementById('certOverlay');
const BACK='<svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#d4a24c" stroke-width="1.6" stroke-linecap="round"><path d="M20 11 L20 5" transform="rotate(0 20 20)"/><path d="M20 11 L20 5" transform="rotate(30 20 20)"/><path d="M20 11 L20 5" transform="rotate(60 20 20)"/><path d="M20 11 L20 5" transform="rotate(90 20 20)"/><path d="M20 11 L20 5" transform="rotate(120 20 20)"/><path d="M20 11 L20 5" transform="rotate(150 20 20)"/><path d="M20 11 L20 5" transform="rotate(180 20 20)"/><path d="M20 11 L20 5" transform="rotate(210 20 20)"/><path d="M20 11 L20 5" transform="rotate(240 20 20)"/><path d="M20 11 L20 5" transform="rotate(270 20 20)"/><path d="M20 11 L20 5" transform="rotate(300 20 20)"/><path d="M20 11 L20 5" transform="rotate(330 20 20)"/></g><circle cx="20" cy="20" r="6" fill="none" stroke="#d4a24c" stroke-width="1.6"/><circle cx="20" cy="20" r="2.6" fill="#f1cf85"/></svg>';
let S=Store.load(GAME,null),open=[],lock=false,flipTimer=null;
if(!S||!Array.isArray(S.order)||S.order.length!==NP*2||!Array.isArray(S.matched))S=fresh();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return{order:shuffle([...Array(NP*2).keys()]),matched:[],flips:0,won:false}}
function save(){Store.save(GAME,S)}
function total(){return S.matched.length*10}

function build(){grid.innerHTML='';
  S.order.forEach((id,pos)=>{const pair=P[id>>1],isName=(id&1)===0,b=document.createElement('button');b.className='card';b.dataset.pos=pos;
    b.setAttribute('aria-label',`Card ${pos+1}, face down`);
    b.innerHTML=`<span class="inner"><span class="face bk">${BACK}</span><span class="face front">${isName?`<span class="tag">Name</span><span class="nm"></span>`:`<span class="tag">Verse</span><span class="vs"></span><span class="rf"></span>`}</span></span>`;
    if(isName)b.querySelector('.nm').textContent=pair.name;else{b.querySelector('.vs').textContent=pair.verse;b.querySelector('.rf').textContent=pair.ref}
    b.addEventListener('click',()=>flip(pos));grid.appendChild(b)})}
function label(pos){const id=S.order[pos],pair=P[id>>1];return(id&1)===0?`Name: ${pair.name}`:`Verse: ${pair.verse.replace('___','blank')}, ${pair.ref}`}

function paint(){[...grid.children].forEach((c,pos)=>{const pair=S.order[pos]>>1,m=S.matched.includes(pair);c.classList.toggle('matched',m);c.classList.toggle('up',open.includes(pos));
    c.setAttribute('aria-label',m||open.includes(pos)?label(pos):`Card ${pos+1}, face down`)});
  foundEl.innerHTML=S.won?'All six names found':`<b>${S.matched.length}</b> of ${NP} matched`}

function flip(pos){if(lock||S.won)return;const pair=S.order[pos]>>1;if(S.matched.includes(pair)||open.includes(pos))return;
  open.push(pos);grid.children[pos].classList.add('up');grid.children[pos].setAttribute('aria-label',label(pos));Sound.tone(440,.08,0,.04);
  if(open.length<2)return;
  S.flips++;const[a,b]=open;
  if((S.order[a]>>1)===(S.order[b]>>1)){S.matched.push(pair);open=[];const won=S.matched.length===NP;if(won)S.won=true;save();
    setTimeout(()=>{paint();Sound.line();const c=center(b);floatText(c.x,c.y,'+10');Score.set(total());if(won)setTimeout(win,700)},380)}
  else{lock=true;save();flipTimer=setTimeout(()=>{open=[];lock=false;paint()},1200)}}

function center(pos){const t=grid.children[pos].getBoundingClientRect(),w=fx.getBoundingClientRect();return{x:t.left-w.left+t.width/2,y:t.top-w.top+t.height/2}}
function floatText(x,y,txt){const e=document.createElement('span');e.className='float';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';fx.appendChild(e);
  e.animate([{transform:'translate(-50%,-50%) scale(.7)',opacity:0},{transform:'translate(-50%,-100%) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-220%) scale(1)',opacity:0}],{duration:1000,easing:'ease-out',fill:'forwards'}).onfinish=()=>e.remove()}

function win(){paint();verseCard.classList.remove('hidden');certBtn.classList.remove('hidden');againBtn.classList.remove('hidden');
  verseCard.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:600,easing:'ease-out'});
  setTimeout(()=>celebrate({title:TITLE,score:total()}),1600)}

function applyState(){clearTimeout(flipTimer);open=[];lock=false;grid.classList.add('no-anim');build();paint();
  verseCard.classList.toggle('hidden',!S.won);certBtn.classList.toggle('hidden',!S.won);againBtn.classList.toggle('hidden',!S.won);Score.set(total(),false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>grid.classList.remove('no-anim')))}
function reset(){Store.reset(GAME);S=fresh();overlay.classList.remove('open');applyState();save()}

document.getElementById('verseText').textContent=LESSON.revealVerse.text;
document.getElementById('verseRef').textContent=LESSON.revealVerse.ref;
Menu.init({onUndo:()=>{},onReset:reset,canUndo:()=>false});
applyState();
certBtn.addEventListener('click',()=>celebrate({title:TITLE,score:total()}));
againBtn.addEventListener('click',reset);
</script>
</body>
</html>
